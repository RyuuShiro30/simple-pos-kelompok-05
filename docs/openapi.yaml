openapi: 3.0.0

info:
  title: Simple POS API
  description: Dokumentasi API untuk aplikasi Simple POS
  version: 1.0.0
  license:
    name: Not specified

servers:
  - url: http://127.0.0.1:8000
    description: Local Development Server

paths:
 /api/v1/login:
    post:
      operationId: login
      summary: Login dan mendapatkan token
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@pos.test
                password:
                  type: string
                  example: password
      responses:
        '200':
          description: Login berhasil dan token diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: 1|example-token
        '401':
          description: Email atau password tidak valid

  /api/logout:
    post:
      operationId: logout
      summary: Logout pengguna
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout berhasil
        '401':
          description: Token tidak ada atau tidak valid

  /api/categories:
    get:
      operationId: getCategories
      summary: Mengambil daftar kategori
      tags:
        - Categories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar kategori berhasil ditampilkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: Makanan
        '401':
          description: Token tidak ada atau tidak valid

  /api/products:
    get:
      operationId: getProducts
      summary: Mengambil daftar produk
      description: Menampilkan daftar produk dengan filter kategori, pencarian, sorting, dan pagination.
      tags:
        - Products
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Nomor halaman pagination
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1

        - name: per_page
          in: query
          required: false
          description: Jumlah produk per halaman (1 sampai 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
          example: 10

        - name: category_id
          in: query
          required: false
          description: Filter produk berdasarkan ID kategori
          schema:
            type: integer
          example: 1

        - name: q
          in: query
          required: false
          description: Pencarian berdasarkan nama produk (minimal 2 karakter)
          schema:
            type: string
            minLength: 2
          example: nasi

        - name: sort
          in: query
          required: false
          description: |
            Pengurutan produk:
            name = nama A-Z
            -name = nama Z-A
            price = harga terendah
            -price = harga tertinggi
          schema:
            type: string
            enum:
              - name
              - -name
              - price
              - -price
            default: name
          example: price

      responses:
        '200':
          description: Daftar produk berhasil ditampilkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: Nasi Goreng
                        price:
                          type: integer
                          example: 15000
                        category:
                          type: string
                          nullable: true
                          example: Makanan
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        nullable: true
                      last:
                        type: string
                        nullable: true
                      prev:
                        type: string
                        nullable: true
                      next:
                        type: string
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: integer
                        nullable: true
                      last_page:
                        type: integer
                        example: 5
                      per_page:
                        type: integer
                        example: 15
                      to:
                        type: integer
                        nullable: true
                      total:
                        type: integer
                        example: 75
        '401':
          description: Token tidak ada atau tidak valid
        '422':
          description: Parameter filter atau pencarian tidak valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string

  /api/transactions:
    post:
      operationId: createTransaction
      summary: Membuat transaksi baru
      tags:
        - Transactions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - product_id
                      - qty
                    properties:
                      product_id:
                        type: integer
                        example: 1
                      qty:
                        type: integer
                        example: 2
      responses:
        '201':
          description: Transaksi berhasil disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      total:
                        type: integer
        '401':
          description: Token tidak ada atau tidak valid
        '422':
          description: Input transaksi tidak valid

  /api/transactions/{transaction}:
    get:
      operationId: getTransactionDetail
      summary: Melihat detail transaksi
      tags:
        - Transactions
      security:
        - bearerAuth: []
      parameters:
        - name: transaction
          in: path
          required: true
          description: ID transaksi
          schema:
            type: integer
      responses:
        '200':
          description: Detail transaksi berhasil ditampilkan
        '401':
          description: Token tidak ada atau tidak valid
        '404':
          description: Transaksi tidak ditemukan

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum Token
